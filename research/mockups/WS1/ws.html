<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WS1 mockups: full-screen workspaces</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../design/ui2/tokens.css">
<style>
  /* WS1 mockup layer on top of the real UI2 tokens. Everything here is a MOCKUP: numbers and prices are placeholders. */
  body { overflow: hidden; }
  #root { height: 100vh; display: flex; flex-direction: column; }
  .hd { height: var(--header-h); flex: none; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s3); background: var(--bg-panel); border-bottom: 1px solid var(--line); }
  .hd .chips { display: flex; align-items: center; gap: var(--s3); margin: 0 auto; padding: 0 var(--s3); height: 34px; border-radius: var(--r-card); background: var(--bg-raised); border: 1px solid var(--line); font-size: var(--fs-sm); }
  .hd .chips b { font-size: var(--fs-md); }
  .body { flex: 1; display: flex; min-height: 0; }
  .rail a.dim { opacity: .55; }
  .ws { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg-app); }
  .wbar { flex: none; height: 54px; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); background: var(--bg-panel); border-bottom: 1px solid var(--line); }
  .wbar h2 { margin: 0; font-size: 18px; } .wbar .sub { color: var(--text-2); font-size: var(--fs-sm); }
  .wbar .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); font-size: var(--fs-sm); font-weight: 600; }
  .wbar .live.draft { color: var(--warn); }
  .wbar .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .grow { flex: 1; }
  /* frame A: preview left, catalogue right */
  .fa { flex: 1; display: grid; grid-template-columns: minmax(380px, 40%) minmax(0, 1fr); min-height: 0; }
  .col-l { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .col-r { overflow: hidden; padding: var(--s4); display: grid; align-content: start; gap: var(--s3); }
  .pv { position: relative; background: #e9e4da center / cover no-repeat; flex: none; overflow: hidden; }
  .pv .ov { z-index: 2; } .pv .tl { position: absolute; top: 10px; left: 10px; } .pv .tr { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; } .pv .bl { position: absolute; bottom: 10px; left: 10px; }
  .pv .tag { position: absolute; z-index: 2; padding: 3px 8px; border-radius: 6px; background: var(--glass); font-size: var(--fs-sm); border: 1px solid rgba(255,255,255,.1); }
  .pv .hl { position: absolute; border: 2px solid var(--accent); border-radius: 8px; box-shadow: 0 0 0 3px #4f8cff33; }
  .under { padding: var(--s3) var(--s4); display: grid; gap: var(--s3); overflow: hidden; align-content: start; }
  .tray { display: flex; gap: var(--s2); flex-wrap: wrap; }
  .tray .it { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 6px 0 4px; border-radius: 8px; background: var(--bg-raised); border: 1px solid var(--line); font-size: var(--fs-sm); }
  .tray .it .pic { width: 24px; height: 24px; border-radius: 5px; background: #d9dde3 center/contain no-repeat; }
  .tray .it i { font-style: normal; color: var(--text-3); margin-left: 2px; }
  /* tiles */
  .grid { display: grid; gap: var(--s3); grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); }
  .wt { position: relative; background: var(--bg-raised); border: 1px solid var(--line); border-radius: var(--r-card); overflow: hidden; display: flex; flex-direction: column; }
  .wt .pic { height: var(--ph, 112px); background: #d9dde3 center / contain no-repeat; display: grid; place-items: center; }
  .wt.cover .pic { background-size: cover; }
  .wt .b { padding: 8px 10px 10px; display: grid; gap: 4px; }
  .wt .t { font-weight: 600; } .wt .m { color: var(--text-2); font-size: var(--fs-sm); }
  .wt .pl { display: flex; flex-wrap: wrap; gap: 4px; } .wt .pill { height: 20px; font-size: 11px; padding: 0 7px; }
  .wt.in { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .wt .cnt { position: absolute; top: 8px; right: 8px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .wt .rib { position: absolute; top: 8px; left: -1px; padding: 2px 8px 2px 8px; background: var(--warn); color: #1a1405; font-size: 11px; font-weight: 700; border-radius: 0 6px 6px 0; }
  .wt .add { display: flex; gap: 6px; margin-top: 2px; }
  .stp { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-sunken); height: 24px; }
  .stp span { min-width: 22px; text-align: center; font-weight: 700; font-size: 12px; } .stp i { font-style: normal; width: 22px; text-align: center; color: var(--text-2); }
  .h3 { display: flex; align-items: baseline; gap: var(--s2); } .h3 b { font-size: var(--fs-lg); } .h3 span { color: var(--text-3); font-size: var(--fs-sm); } .h3 a { margin-left: auto; color: var(--accent); font-size: var(--fs-sm); }
  .seg button { font-size: var(--fs-sm); }
  .cats { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; }
  .chip.big { height: 30px; padding: 0 12px; font-size: var(--fs-md); }
  .tab { height: 34px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-bottom: 2px solid transparent; color: var(--text-2); font-weight: 600; }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); } .tab .n { color: var(--text-3); font-weight: 400; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); gap: 2px; }
  .sw { width: 54px; height: 54px; border-radius: 10px; border: 2px solid var(--line); background-size: 7px 7px, 11px 11px; }
  .sw.on { border-color: var(--accent); box-shadow: 0 0 0 2px #4f8cff44; }
  .swl { display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--text-2); }
  .dot-c { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; }
  .dot-c.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .panelcard { border: 1px solid var(--line); border-radius: var(--r-card); background: var(--bg-panel); padding: var(--s3); display: grid; gap: var(--s2); }
  .kv { display: flex; justify-content: space-between; color: var(--text-2); font-size: var(--fs-sm); } .kv b { color: var(--text); }
  .nt { font-size: var(--fs-sm); color: var(--text-2); }
  .fl { display: grid; gap: var(--s2); padding: var(--s4); align-content: start; background: var(--bg-panel); border-right: 1px solid var(--line); width: 210px; flex: none; overflow: hidden; }
  .fl .chip { justify-self: start; }
  .sec-slider { display: grid; grid-template-columns: 90px 1fr 70px; gap: 8px; align-items: center; font-size: var(--fs-sm); color: var(--text-2); }
  .sec-slider .v { text-align: right; color: var(--text); font-variant-numeric: tabular-nums; }
  .roles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .role { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 8px; font-size: 11px; color: var(--text-3); min-height: 48px; display: grid; gap: 2px; align-content: center; }
  .role.f { border-style: solid; background: var(--bg-raised); color: var(--text-2); } .role.f b { color: var(--text); font-size: 12px; } .role.cur { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  /* frame B: strip on top */
  .fb { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .fb .pv { height: 250px; } .fb .cat { padding: var(--s4); overflow: hidden; display: grid; gap: var(--s3); align-content: start; }
  /* frame C: full preview, drawer over it */
  .fc { flex: 1; position: relative; min-height: 0; } .fc .pv { position: absolute; inset: 0; }
  .fc .drawerb { position: absolute; left: 0; right: 0; bottom: 0; height: 52%; background: var(--glass); backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,.12); padding: var(--s3) var(--s4); overflow: hidden; display: grid; gap: var(--s2); align-content: start; border-radius: 14px 14px 0 0; }
  .fc .grab { width: 44px; height: 4px; border-radius: 2px; background: var(--text-3); justify-self: center; }
  /* phone */
  body.phone #root { width: 390px; height: 844px; }
  .ph-hd { height: 50px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--bg-panel); border-bottom: 1px solid var(--line); }
  .ph-hd h2 { margin: 0; font-size: 17px; flex: 1; }
  .ph-sum { flex: none; height: 30px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--bg-raised); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-2); white-space: nowrap; }
  .ph-sum b { color: var(--text); }
  .ph-body { flex: 1; overflow: hidden; display: grid; align-content: start; gap: 10px; padding-bottom: 10px; }
  .ph-body .pv { height: 190px; }
  .ph-pad { padding: 0 12px; } .hs { display: flex; gap: 6px; overflow: hidden; padding: 0 12px; }
  .ph-tabbar { height: 56px; flex: none; display: flex; background: var(--bg-panel); border-top: 1px solid var(--line); }
  .ph-tabbar button { flex: 1; border: 0; background: none; color: var(--text-2); font-size: 10.5px; display: grid; justify-items: center; align-content: center; gap: 2px; }
  .ph-tabbar button.on { color: var(--accent); }
  .ph-bar { flex: none; padding: 10px 12px; background: var(--bg-panel); border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  .btn.big { height: 40px; padding: 0 18px; } .btn.grow { flex: 1; justify-content: center; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg-panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 12px 16px 16px; display: grid; gap: 10px; box-shadow: 0 -10px 30px rgba(0,0,0,.5); z-index: 30; }
  .note-b { font-size: 12px; color: var(--text-2); }
  .frame3 { display: flex; gap: 24px; align-items: flex-start; padding: 20px; height: 100vh; background: #0d1015; }
  .frame3 .fr { display: grid; gap: 8px; justify-items: center; color: var(--text-2); font-size: 13px; } .frame3 .fr .box { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; }
  .frame3 iframe { border: 0; transform-origin: 0 0; }
  .ann { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--warn); color: #111; font-weight: 800; font-size: 12px; display: grid; place-items: center; z-index: 50; box-shadow: 0 0 0 3px #0008; }
  .lg { display: grid; gap: 10px; font-size: 13px; color: var(--text-2); line-height: 1.35; } .lg b { color: var(--text); } .lg .ln { display: flex; gap: 10px; align-items: flex-start; }
  .lg .ln .ann { position: static; flex: none; }
</style></head>
<body>
<script src="../../design/ui2/icons.js"></script><script src="../../design/ui2/shell.js"></script>
<div id="root"></div>
<script>
const Q = new URLSearchParams(location.search), P = Q.get('p') || 'scape', F = Q.get('f') || 'A';
const A = f => `assets/${f}`;
const pic = (f, extra = '') => `background-image:url(${A(f)});${extra}`;
const root = document.getElementById('root');
const PH = P.startsWith('p-');
if (PH) document.body.classList.add('phone');
const pill = (t, k = '') => `<span class="pill ${k}">${t}</span>`;

/* ---- illustrative stone / wood / decor art (no model renders exist for these yet: flagged in notes.md) ---- */
function rockSvg(k) {
  const M = {
    seiryu: ['#76808e', '#48515c', 'M14 98 L36 44 L66 58 L92 18 L126 52 L160 40 L176 98Z', 'M52 58 L70 90 M96 30 L108 78 M128 54 L144 92'],
    dragon: ['#b9a273', '#85703f', 'M16 98 C6 62 48 24 98 30 C148 34 178 66 168 98Z', ''],
    texas: ['#d6cfbc', '#a69d86', 'M16 98 C8 60 50 28 98 30 C148 32 176 64 168 98Z', ''],
    lace: ['#d9d3c3', '#a8a18f', 'M20 98 C10 70 44 30 90 24 C140 22 178 62 164 98Z', ''],
    lava: ['#6a4439', '#3a241f', 'M18 98 L32 52 L58 62 L80 24 L110 58 L136 38 L172 96Z', ''],
    iron: ['#5a5047', '#2f2a25', 'M14 98 L30 62 L70 36 L120 30 L168 56 L176 98Z', ''],
    slate: ['#5f6770', '#3c424a', 'M14 96 L22 70 L100 46 L172 62 L176 96Z', 'M30 80 L160 70'],
    ledge: ['#a39b8d', '#6f685b', 'M12 98 L18 58 L70 50 L72 34 L132 34 L136 52 L178 58 L180 98Z', 'M20 70 L176 70 M18 84 L178 84'],
  }[k];
  const [c1, c2, d, veins] = M;
  const holes = (k === 'texas' || k === 'lace') ? [[70, 70, 9], [104, 56, 7], [128, 76, 10], [88, 88, 6], [50, 86, 6], [118, 44, 5]].map(([x, y, r]) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .8}" fill="${c2}" opacity=".8"/>`).join('') : '';
  const pits = k === 'dragon' ? [[60, 62, 5], [96, 48, 6], [130, 66, 5], [80, 84, 4], [114, 86, 5], [48, 84, 3]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c2}" opacity=".75"/>`).join('') : '';
  const white = k === 'seiryu' ? `<path d="${veins}" stroke="#e9edf2" stroke-width="2.2" fill="none" opacity=".85"/>` : '';
  return `<svg viewBox="0 0 190 120" width="100%" height="100%"><defs><linearGradient id="g${k}" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><ellipse cx="95" cy="104" rx="78" ry="7" fill="#0003"/><path d="${d}" fill="url(#g${k})" stroke="${c2}" stroke-width="1.5" stroke-linejoin="round"/>${holes}${pits}${white}</svg>`;
}
function woodSvg(k) {
  const c = { drift: '#8a6a49', spider: '#4b3a2c', manz: '#a4533a', mopani: '#6b4a2b', cork: '#9c7a4d', tube: '#8c6a43' }[k];
  const paths = {
    drift: 'M20 98 C40 70 70 78 96 58 C118 42 140 54 172 30', spider: 'M24 96 C30 60 52 40 56 24 M56 24 C70 44 66 66 96 74 C120 80 136 62 170 66 M96 74 C104 52 118 40 128 26',
    manz: 'M22 98 C36 60 60 54 78 30 M52 60 C80 66 100 52 128 34 M96 56 C124 74 146 70 172 52', mopani: 'M20 94 C46 58 82 74 108 56 C138 36 160 56 176 40',
    cork: 'M26 92 L28 52 L120 40 L172 50 L170 92Z', tube: 'M30 96 L36 40 L150 34 L160 96Z',
  }[k];
  if (k === 'cork' || k === 'tube') return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="98" cy="104" rx="76" ry="6" fill="#0003"/><path d="${paths}" fill="${c}" stroke="#5c4428" stroke-width="2"/><path d="M50 48 L52 88 M80 44 L84 90 M112 42 L118 90 M140 46 L146 90" stroke="#6e5230" stroke-width="2" opacity=".7"/>${k === 'tube' ? '<ellipse cx="40" cy="66" rx="10" ry="26" fill="#2a1f14"/>' : ''}</svg>`;
  return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="98" cy="106" rx="76" ry="6" fill="#0003"/><path d="${paths}" stroke="${c}" stroke-width="${k === 'spider' ? 7 : 12}" fill="none" stroke-linecap="round"/><path d="${paths}" stroke="#fff" stroke-opacity=".12" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
function decorSvg(k) {
  if (k === 'arch') return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="104" rx="76" ry="6" fill="#0003"/><path d="M20 100 L22 60 C30 24 160 24 168 60 L170 100 L138 100 L136 66 C128 48 62 48 54 66 L52 100Z" fill="#8f877a" stroke="#5b564c" stroke-width="2"/></svg>`;
  if (k === 'clay') return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="104" rx="70" ry="6" fill="#0003"/><path d="M30 98 L34 50 C70 34 130 34 164 50 L164 98Z" fill="#b5663a" stroke="#7a3f21" stroke-width="2"/><ellipse cx="46" cy="74" rx="14" ry="24" fill="#3a1d10"/></svg>`;
  if (k === 'coco') return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="104" rx="60" ry="6" fill="#0003"/><path d="M40 98 C30 40 160 40 150 98Z" fill="#6a4a2a" stroke="#40291a" stroke-width="2"/><ellipse cx="66" cy="84" rx="16" ry="16" fill="#1d130b"/></svg>`;
  if (k === 'planter') return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="104" rx="70" ry="6" fill="#0003"/><path d="M28 98 C26 60 60 50 96 50 C132 50 166 60 162 98Z" fill="#8a8579" stroke="#5b564c" stroke-width="2"/><ellipse cx="96" cy="52" rx="38" ry="8" fill="#2c2a25"/></svg>`;
  if (k === 'ship') return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="106" rx="76" ry="6" fill="#0003"/><path d="M26 76 L164 76 L146 100 L48 100Z" fill="#7b5632" stroke="#472f18" stroke-width="2"/><path d="M96 74 L96 18 M96 22 L142 62 L96 62Z M96 30 L58 62 L96 62" fill="#e9e2d0" stroke="#888" stroke-width="1.5"/></svg>`;
  if (k === 'castle') return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="106" rx="70" ry="6" fill="#0003"/><path d="M36 100 L36 52 L50 52 L50 40 L62 40 L62 52 L78 52 L78 30 L92 30 L92 20 L104 20 L104 30 L118 30 L118 52 L134 52 L134 40 L146 40 L146 52 L158 52 L158 100Z" fill="#9aa0a8" stroke="#5e636b" stroke-width="2"/><path d="M84 100 L84 74 C84 62 112 62 112 74 L112 100Z" fill="#3e434a"/></svg>`;
  return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="106" rx="66" ry="6" fill="#0003"/><rect x="42" y="56" width="106" height="44" rx="6" fill="#80522a" stroke="#4a2d14" stroke-width="2"/><path d="M42 62 C42 30 148 30 148 62Z" fill="#935d30" stroke="#4a2d14" stroke-width="2"/><rect x="88" y="58" width="14" height="16" rx="2" fill="#d6b24a"/></svg>`;
}
const stoneTile = (n, k, m, pls = [], on = 0, real = '') => `<div class="wt ${on ? 'in' : ''}"><div class="pic" style="${real ? pic(real, 'background-size:cover') : ''}">${real ? '' : (['seiryu', 'dragon', 'texas', 'lace', 'lava', 'iron', 'slate', 'ledge'].includes(k) ? rockSvg(k) : (['drift', 'spider', 'manz', 'mopani', 'cork', 'tube'].includes(k) ? woodSvg(k) : decorSvg(k)))}</div>${on ? `<span class="cnt">${on}</span>` : ''}<div class="b"><div class="t">${n}</div><div class="m">${m}</div>${pls.length ? `<div class="pl">${pls.join('')}</div>` : ''}</div></div>`;

/* ---- shared chrome ---- */
const sums = `<span class="pill warn">Habitat &middot; Caution</span><span><b>$1,264</b> <span style="color:var(--text-3)">&middot; $51/mo</span></span><span>${I('drop')} 75 &deg;F <span class="pill ok">fits</span></span>`;
function header(extra = '') {
  return `<header class="hd"><span class="brand">TankLook</span><span class="proj">&middot; Planted community <span class="dot"></span></span><div class="chips" id="chips">${sums}</div>
  ${extra}<button class="btn icon ghost" title="Undo">${I('undo')}</button><button class="btn icon ghost">${I('redo')}</button><button class="btn sm">${I('save')} Save</button><button class="btn icon ghost">${I('more')}</button></header>`;
}
function railDim(active) {
  return rail(active, { animals: '!' }).replace(/<a class="">/g, '<a class="dim">');
}
function wbar(title, sub, o = {}) {
  const draft = o.draft;
  return `<div class="wbar"><button class="btn icon ghost" title="Back to the main view (Esc)" style="font-size:18px">&#9664;</button><div><h2>${title}</h2><div class="sub">${sub}</div></div>
  <span class="live ${draft ? 'draft' : ''}">${draft ? 'Draft: nothing applied yet' : 'Live: edits change your tank now'}</span><span class="grow"></span>
  ${o.mid || ''}
  ${draft ? `<button class="btn">Cancel</button><button class="btn primary">${o.apply || 'Use this tank'}</button>`
    : `<button class="btn ghost" title="Undo everything since you opened ${title}">&#8630; Revert this visit</button><button class="btn primary">Done</button>`}</div>`;
}
const PV = (o = {}) => `<div class="pv" style="${pic(o.img || 'tank-render.jpg')}${o.h ? `height:${o.h}px;` : ''}${o.pos ? `background-position:${o.pos};` : ''}${o.fit ? 'background-size:contain;background-color:#ddd6c8;' : ''}">
  <span class="tag" style="top:10px;left:10px">Live preview</span>
  <div class="tr"><button class="btn sm glass" style="background:var(--glass)">${I('eye')} View &#9662;</button><button class="btn sm" style="background:var(--glass)">${I('shuffle')} Another moment</button></div>${o.in || ''}</div>`;
const frame = (left, right) => `<div class="fa"><div class="col-l">${left}</div><div class="col-r">${right}</div></div>`;
function page(inner, active, wb) {
  root.innerHTML = header() + `<div class="body">${railDim(active)}<div class="ws">${wb}${inner}</div></div>`;
}
const search = ph => `<div class="input" style="display:flex;align-items:center;gap:6px;color:var(--text-3);width:100%;height:34px">${I('search')} ${ph}</div>`;
const chipRow = (arr, on = 0, cls = 'big') => `<div class="cats">${arr.map((t, i) => `<span class="chip ${cls} ${i === on ? 'on' : ''}">${t}</span>`).join('')}</div>`;
const trayItem = (n, f, c) => `<span class="it"><span class="pic" style="${pic(f)}"></span>${n}${c ? `<i>&times;${c}</i>` : ''}</span>`;
const tankSvg = (L, W, H, shape = 'box') => {
  const s = 118 / Math.max(L, H * 2.4), w = Math.max(36, L * s), h = Math.max(22, H * s * 1.6);
  const x = (190 - w) / 2, y = 100 - h;
  const body = shape === 'hex' ? `<path d="M${x + 14} ${y} L${x + w - 14} ${y} L${x + w} ${y + h / 2} L${x + w - 14} ${y + h} L${x + 14} ${y + h} L${x} ${y + h / 2}Z" />` : `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>`;
  const bow = shape === 'bow' ? `<path d="M${x} ${y + h} C${x + w * .25} ${y + h + 14} ${x + w * .75} ${y + h + 14} ${x + w} ${y + h}" fill="none" stroke="#9fd4cf" stroke-width="2"/>` : '';
  return `<svg viewBox="0 0 190 120" width="100%" height="100%"><ellipse cx="95" cy="106" rx="${w / 2 + 6}" ry="5" fill="#0003"/><g fill="#cfe7ea" fill-opacity=".55" stroke="#2c3b3e" stroke-width="3">${body}</g><rect x="${x}" y="${y}" width="${w}" height="5" fill="#222"/><rect x="${x + 2}" y="${y + h * .35}" width="${w - 4}" height="${h * .65 - 2}" fill="#7fb7c4" fill-opacity=".35"/>${bow}</svg>`;
};
