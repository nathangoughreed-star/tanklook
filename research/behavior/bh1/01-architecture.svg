<svg xmlns='http://www.w3.org/2000/svg' width='1220' height='570' viewBox='0 0 1220 570' font-family='Segoe UI, Arial, sans-serif'><rect width='1220' height='570' fill='#fbfaf7'/><text x='20' y='34' font-size='22' font-weight='600' fill='#222'>BH1: behavior system layers</text><text x='20' y='58' font-size='15' fill='#555' text-anchor='start' font-weight='400'>Three layers. A species is a data file (its ethogram), never code. Five pilots use it; every other fish keeps today's sim.</text><rect x='20' y='80' width='360' height='300' rx='10' fill='#e7f0e3' stroke='#5c8a4a' stroke-width='2'/><text x='36' y='110' font-size='17' fill='#5c8a4a' text-anchor='start' font-weight='700'>1  World: what the scape offers</text><text x='36' y='142' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Places (tagged spots): cave-in, cave-mouth,</text><text x='36' y='170' font-size='14' fill='#333' text-anchor='start' font-weight='400'>overhang, crevice, root-mass, open-sand,</text><text x='36' y='198' font-size='14' fill='#333' text-anchor='start' font-weight='400'>glass, leaf (slice 2)</text><text x='36' y='226' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Surfaces at any angle (normal + exact</text><text x='36' y='254' font-size='14' fill='#333' text-anchor='start' font-weight='400'>local shape for rock, wood, cave shell)</text><text x='36' y='282' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Insides: hollow caves, permeable roots,</text><text x='36' y='310' font-size='14' fill='#333' text-anchor='start' font-weight='400'>buryable sand</text><text x='36' y='338' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Food patches: graze spots, sift spots</text><line x1='382' y1='230' x2='418' y2='230' stroke='#555' stroke-width='2.5'/><polygon points='418,230 407.9,234.3 407.9,225.7' fill='#555'/><rect x='420' y='80' width='360' height='300' rx='10' fill='#e5ecf6' stroke='#4a6a9a' stroke-width='2'/><text x='436' y='110' font-size='17' fill='#4a6a9a' text-anchor='start' font-weight='700'>2  Mind: one behavior at a time</text><text x='436' y='142' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Drives: rest, forage, explore, company,</text><text x='436' y='170' font-size='14' fill='#333' text-anchor='start' font-weight='400'>security, air (cory), social</text><text x='436' y='198' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Personality per fish: activity, boldness,</text><text x='436' y='226' font-size='14' fill='#333' text-anchor='start' font-weight='400'>curiosity, aggression, favourite spot; rank</text><text x='436' y='254' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Score = drive x personality x place near</text><text x='436' y='282' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Overrides: startle (spreads), intruder</text><text x='436' y='310' font-size='14' fill='#333' text-anchor='start' font-weight='400'>near home, air need</text><text x='436' y='338' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Encounter scripts: dominance, courting</text><line x1='782' y1='230' x2='818' y2='230' stroke='#555' stroke-width='2.5'/><polygon points='818,230 807.9,234.3 807.9,225.7' fill='#555'/><rect x='820' y='80' width='360' height='300' rx='10' fill='#f6ebe0' stroke='#a0662e' stroke-width='2'/><text x='836' y='110' font-size='17' fill='#a0662e' text-anchor='start' font-weight='700'>3  Body: how it moves and rests</text><text x='836' y='142' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Movement clock: burst, glide, pause</text><text x='836' y='170' font-size='14' fill='#333' text-anchor='start' font-weight='400'>(explosive start = burst, no wind-up)</text><text x='836' y='198' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Body modes: tail swimmer / surface</text><text x='836' y='226' font-size='14' fill='#333' text-anchor='start' font-weight='400'>crawler / whole-body undulator</text><text x='836' y='254' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Rest pose fits the surface: perch, belly-</text><text x='836' y='282' font-size='14' fill='#333' text-anchor='start' font-weight='400'>down, cling upside down, lie curved, drape</text><text x='836' y='310' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Secondary motion: pectorals, mouth,</text><text x='836' y='338' font-size='14' fill='#333' text-anchor='start' font-weight='400'>barbels (long-fin trailing in slice 2)</text><rect x='20' y='410' width='1160' height='70' rx='10' fill='#fff' stroke='#999' stroke-width='2'/><text x='36' y='438' font-size='14' fill='#333' text-anchor='start' font-weight='400'>Species file (JSON, from the ethogram): body mode, attach mode, clock lengths, rest postures + weights, cohesion + contact, home type,</text><text x='36' y='462' font-size='14' fill='#333' text-anchor='start' font-weight='400'>forage styles, escape kind, displays (dominance pose, courting script). Feeds all three layers.</text><line x1='200' y1='410' x2='200' y2='384' stroke='#999' stroke-width='2'/><polygon points='200,384 204.3,394.1 195.7,394.1' fill='#999'/><line x1='600' y1='410' x2='600' y2='384' stroke='#999' stroke-width='2'/><polygon points='600,384 604.3,394.1 595.7,394.1' fill='#999'/><line x1='1000' y1='410' x2='1000' y2='384' stroke='#999' stroke-width='2'/><polygon points='1000,384 1004.3,394.1 995.7,394.1' fill='#999'/><rect x='820' y='500' width='360' height='50' rx='10' fill='#eee' stroke='#888' stroke-width='2'/><text x='1000' y='531' font-size='14' fill='#333' text-anchor='middle' font-weight='400'>fish3d: pose per frame (unchanged renderer)</text><path d='M1185,230 C1215,230 1215,525 1182,525' fill='none' stroke='#a0662e' stroke-width='2.5'/><line x1='1186' y1='525' x2='1181' y2='525' stroke='#a0662e' stroke-width='2.5'/><polygon points='1181,525 1191.1,520.7 1191.1,529.3' fill='#a0662e'/><text x='20' y='530' font-size='14' fill='#a33' text-anchor='start' font-weight='400'>Out of scope: tank events, day/night, breeding mechanics.</text></svg>