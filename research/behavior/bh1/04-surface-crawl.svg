'#222' stroke-width='1.2'/><circle cx='22.0' cy='-2.0' r='1.7' fill='#111'/></g><line x1='857.0686249999999' y1='458.2155' x2='902.0666545290226' y2='458.63661578598015' stroke='#2a7' stroke-width='2'/><polygon points='902.0666545290226,458.63661578598015 891.9,462.8 892.0,454.3' fill='#2a7'/><g transform='translate(855.0687125764878,458.19678374284535) rotate(90.53618909790464) scale(1,1)' opacity='1'><path d='M7.0,-8.9 Q-2.9,-14.8 -15.1,-5.4Z' fill='#5a5048' opacity='.8'/><path d='M-15.4,0.0 L-29.0,-10.8 L-26.7,0.0 L-29.0,10.8Z' fill='#5a5048' opacity='.85'/><path d='M29.0,-2.8 L25.7,-5.3 L22.4,-7.1 L19.1,-8.5 L15.7,-9.5 L12.4,-10.1 L9.1,-10.4 L5.8,-10.2 L2.5,-9.7 L-0.8,-8.8 L-4.1,-7.5 L-7.5,-5.8 L-10.8,-3.6 L-14.1,-0.5 L-17.4,-0.5 L-17.4,0.5 L-14.1,0.5 L-10.8,3.6 L-7.5,5.8 L-4.1,7.5 L-0.8,8.8 L2.5,9.7 L5.8,10.2 L9.1,10.4 L12.4,10.1 L15.7,9.5 L19.1,8.5 L22.4,7.1 L25.7,5.3 L29.0,2.8Z' fill='#5a5048' stroke='#222' stroke-width='1.2'/><circle cx='22.0' cy='-2.0' r='1.7' fill='#111'/></g><text x='640' y='160' font-size='13' fill='#2a7' text-anchor='start' font-weight='400'>normal = gradient of the distance field</text><rect x='40' y='80' width='360' height='120' rx='10' fill='#fff' stroke='#999' stroke-width='2'/><text x='56' y='106' font-size='14' fill='#333' text-anchor='start' font-weight='600'>Crawl step (repeats, with pauses):</text><text x='56' y='130' font-size='13' fill='#333' text-anchor='start' font-weight='400'>1 release mouth</text><text x='56' y='148' font-size='13' fill='#333' text-anchor='start' font-weight='400'>2 slide 0.1-0.2 body length</text><text x='56' y='166' font-size='13' fill='#333' text-anchor='start' font-weight='400'>3 reattach, rear swings round</text><text x='56' y='184' font-size='13' fill='#333' text-anchor='start' font-weight='400'>4 pause; mouth works only if grazing</text><path d='M860,470 C950,420 1010,380 1068,360' fill='none' stroke='#c33' stroke-width='2.5' stroke-dasharray='8 5'/><line x1='1050' y1='366' x2='1068' y2='360' stroke='#c33' stroke-width='2.5'/><polygon points='1068,360 1059.7,367.3 1057.0,359.1' fill='#c33'/><text x='900' y='360' font-size='13' fill='#c33' text-anchor='start' font-weight='400'>longer trip: let go, a few</text><text x='900' y='378' font-size='13' fill='#c33' text-anchor='start' font-weight='400'>strong strokes, reattach</text><g transform='translate(1066,300) rotate(-90) scale(1,1)' opacity='1'><path d='M7.0,-8.9 Q-2.9,-14.8 -15.1,-5.4Z' fill='#5a5048' opacity='.8'/><path d='M-15.4,0.0 L-29.0,-10.8 L-26.7,0.0 L-29.0,10.8Z' fill='#5a5048' opacity='.85'/><path d='M29.0,-2.8 L25.7,-5.3 L22.4,-7.1 L19.1,-8.5 L15.7,-9.5 L12.4,-10.1 L9.1,-10.4 L5.8,-10.2 L2.5,-9.7 L-0.8,-8.8 L-4.1,-7.5 L-7.5,-5.8 L-10.8,-3.6 L-14.1,-0.5 L-17.4,-0.5 L-17.4,0.5 L-14.1,0.5 L-10.8,3.6 L-7.5,5.8 L-4.1,7.5 L-0.8,8.8 L2.5,9.7 L5.8,10.2 L9.1,10.4 L12.4,10.1 L15.7,9.5 L19.1,8.5 L22.4,7.1 L25.7,5.3 L29.0,2.8Z' fill='#5a5048' stroke='#222' stroke-width='1.2'/><circle cx='22.0' cy='-2.0' r='1.7' fill='#111'/></g><text x='600' y='560' font-size='13' fill='#555' text-anchor='middle' font-weight='400'>Corners and edges: the rounded shape turns the body through them (nerite-style reach across, shift over).</text></svg>