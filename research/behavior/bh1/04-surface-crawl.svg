<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='620' viewBox='0 0 1200 620' font-family='Segoe UI, Arial, sans-serif'><rect width='1200' height='620' fill='#fbfaf7'/><text x='20' y='34' font-size='22' font-weight='600' fill='#222'>BH1: surface crawler (bristlenose; later oto, Amano, nerite)</text><text x='20' y='58' font-size='15' fill='#555' text-anchor='start' font-weight='400'>A crawler is glued to the shell 'clearance = body radius' around every solid; its belly follows the surface normal, not gravity.</text><rect x='1080' y='80' width='26' height='480' fill='#cfe6ee' stroke='#7a9aa8' stroke-width='2'/><text x='1093' y='590' font-size='13' fill='#58a' text-anchor='middle' font-weight='400'>glass</text><path d='M120,520 C140,300 330,200 560,230 C760,255 860,380 820,520 Z' fill='#7a5534' stroke='#3e2a18' stroke-width='3'/><text x='470' y='400' font-size='15' fill='#f3e6d6' text-anchor='middle' font-weight='400'>wood (exact local shape,</text><text x='470' y='422' font-size='15' fill='#f3e6d6' text-anchor='middle' font-weight='400'>rounded edges)</text><path d='M95,525 C115,280 325,170 560,202 C785,230 890,375 848,525' fill='none' stroke='#2a7' stroke-width='2' stroke-dasharray='6 5'/><text x='170' y='255' font-size='13' fill='#2a7' text-anchor='start' font-weight='400'>crawl shell</text><line x1='143.046875' y1='366.671875' x2='104.75784361205274' y2='343.0297499818721' stroke='#2a7' stroke-width='2'/><polygon points='104.75784361205274,343.0297499818721 115.6,344.7 111.1,352.0' fill='#2a7'/><g transform='translate(144.74860972835322,367.7226361119168) rotate(-58.30613437336725) scale(1,1)' opacity='1'><path d='M7.0,-8.9 Q-2.9,-14.8 -15.1,-5.4Z' fill='#5a5048' opacity='.8'/><path d='M-15.4,0.0 L-29.0,-10.8 L-26.7,0.0 L-29.0,10.8Z' fill='#5a5048' opacity='.85'/><path d='M29.0,-2.8 L25.7,-5.3 L22.4,-7.1 L19.1,-8.5 L15.7,-9.5 L12.4,-10.1 L9.1,-10.4 L5.8,-10.2 L2.5,-9.7 L-0.8,-8.8 L-4.1,-7.5 L-7.5,-5.8 L-10.8,-3.6 L-14.1,-0.5 L-17.4,-0.5 L-17.4,0.5 L-14.1