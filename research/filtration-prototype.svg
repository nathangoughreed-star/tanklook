" y="269">prototype 1%</text><text x="10" y="310" font-size="14" font-weight="bold">2. Where the daily nitrogen goes (mock-up; plant numbers are estimates): filter bacteria / plants / left for water changes</text><text x="10" y="354">20 neon, 15 medium plants</text><rect x="250" y="340" width="0" height="20" fill="#2f7fb8"/><rect x="250" y="340" width="14.78125" height="20" fill="#3a9a5c"/><rect x="264.78125" y="340" width="0" height="20" fill="#c0443c"/><text x="270.78125" y="354">0.011 g N/day</text><text x="10" y="414">8 goldfish, 15 medium plants</text><rect x="250" y="400" width="147.81250000000003" height="20" fill="#2f7fb8"/><rect x="397.8125" y="400" width="33.59375" height="20" fill="#3a9a5c"/><rect x="431.40625" y="400" width="0" height="20" fill="#c0443c"/><text x="437.40625" y="414">0.135 g N/day</text><text x="10" y="474">2 oscar, 15 medium plants</text><rect x="250" y="460" width="322.5" height="20" fill="#2f7fb8"/><rect x="572.5" y="460" width="33.59375" height="20" fill="#3a9a5c"/><rect x="606.09375" y="460" width="45.687499999999964" height="20" fill="#c0443c"/><text x="657.78125" y="474">0.299 g N/day</text><line x1="572.5" x2="572.5" y1="330" y2="520" stroke="#2f7fb8" stroke-dasharray="4"/><text x="472.5" y="528">filter capacity 0.24 g/day</text><text x="10" y="548">blue bacteria, green plants, red = more than the filter and plants clear (ammonia rises or big water changes)</text></svg>