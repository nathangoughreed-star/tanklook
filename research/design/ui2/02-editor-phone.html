<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI2 mockup: editor, phone</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .ph { display: grid; width: 390px; height: 844px; grid-template-rows: 48px 290px 44px 1fr 60px; }
  .ph .apphead { padding: 0 var(--s2); }
  .ph .viewer { background: url(tank-render.jpg) 50% 62% / 112% auto no-repeat, linear-gradient(#e9e4da 0 60%, #1d1d20 60%); }
  .strip { display: flex; gap: var(--s1); overflow: hidden; padding: 6px var(--s2); background: var(--bg-panel); border-bottom: 1px solid var(--line); }
  .strip .check { background: var(--bg-raised); height: 32px; padding: 0 var(--s2); flex: none; }
  .sheet { background: var(--bg-panel); border-radius: 14px 14px 0 0; margin-top: -10px; position: relative; z-index: 2; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 -6px 20px rgba(0,0,0,.4); }
  .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--text-3); margin: 8px auto 0; }
  .sheet .sec-head { padding: var(--s2) var(--s4); border: 0; }
  .sheet .sec-body { padding: 0 var(--s3) var(--s3); gap: var(--s2); }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--bg-panel); border-top: 1px solid var(--line); }
  .tabs a { display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 10.5px; color: var(--text-2); }
  .tabs a.on { color: var(--accent); }
</style></head>
<body>
<script src="icons.js"></script><script src="shell.js"></script>
<div class="ph" id="app"></div>
<script>
const sp = (n, m, c, x) => `<div class="card media"><div class="thumb" style="background-image:url(tank-render.jpg);background-size:600%;background-position:${x}"></div><div><div class="t">${n}</div><div class="m">${m}</div></div><div style="display:flex;align-items:center;gap:4px"><button class="btn icon sm">${I('minus')}</button><span class="val" style="min-width:18px;text-align:center">${c}</span><button class="btn icon sm">${I('plus')}</button></div></div>`;
document.getElementById('app').innerHTML = `
<header class="apphead"><span class="brand">TankLook</span><span class="dot"></span><span style="flex:1"></span>
  <button class="btn icon ghost">${I('undo')}</button><button class="btn icon ghost" disabled>${I('redo')}</button><button class="btn icon ghost">${I('save')}</button><button class="btn icon ghost">${I('more')}</button></header>
<main class="viewer">
  <div class="ov" style="top:8px;left:50%;transform:translateX(-50%)"><div class="toolbar glass"><button class="btn sm">${I('eye')} View</button><button class="btn sm">${I('shuffle')} Moment</button><button class="btn icon sm">${I('split')}</button></div></div>
</main>
<div class="strip">
  <div class="check">Habitat <span class="pill warn">Caution</span></div>
  <div class="check"><b>$1,264</b></div>
  <div class="check">${I('drop')} 75 &deg;F</div>
  <div class="check">${I('note')} 3</div>
</div>
<section class="sheet">
  <div class="handle"></div>
  <div class="sec-head"><h2>Animals</h2><button class="btn sm ghost">${I('ideas')} Ideas</button></div>
  <div class="sec-body">
    <div style="display:flex;gap:6px"><div class="input" style="flex:1;display:flex;align-items:center;gap:6px;color:var(--text-3)">${I('search')} Search species</div><button class="btn">Add</button></div>
    <div class="cap">In this tank &middot; 40 animals</div>
    ${sp('Neon tetra', 'school &middot; <span style="color:var(--ok)">fits</span>', 12, '70% 30%')}
    ${sp('Harlequin rasbora', 'school &middot; <span style="color:var(--ok)">fits</span>', 8, '30% 40%')}
    ${sp('Honey gourami', 'pair &middot; <span style="color:var(--warn)">tight with 2</span>', 2, '65% 15%')}
    ${sp('Bronze corydoras', 'bottom &middot; <span style="color:var(--ok)">fits</span>', 6, '50% 70%')}
  </div>
</section>
<nav class="tabs">
  <a><span>${I('tank')}</span>Tank</a><a><span>${I('scape')}</span>Scape</a><a><span>${I('plants')}</span>Plants</a><a class="on"><span>${I('animals')}</span>Animals</a><a><span>${I('more')}</span>More</a>
</nav>`;
</script>
</body></html>
