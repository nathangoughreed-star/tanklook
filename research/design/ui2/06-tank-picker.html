<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>UI2 mockup: Tank > Choose a tank (commercial / custom)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .app { display: grid; height: 100vh; grid-template-columns: var(--rail-w) 420px 1fr; grid-template-rows: var(--header-h) 1fr; grid-template-areas: "head head view" "rail panel view"; }
  .app > header { grid-area: head; } .app > .rail { grid-area: rail; } .app > .panel { grid-area: panel; } .app > .viewer { grid-area: view; }
  .tk { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); }
  .tk .thumb { width: 44px; height: 36px; display: grid; place-items: center; color: #3a4150; }
  .lockbtn { height: var(--ctl-h-sm); padding: 0 var(--s2); border-radius: var(--r-pill); border: 1px solid var(--line); background: transparent; color: var(--text-3); display: inline-flex; align-items: center; }
  .lockbtn .i { width: 14px; height: 14px; }
  .gh .n { color: var(--text-3); font-weight: 400; }
</style></head>
<body>
<script src="icons.js"></script><script src="shell.js"></script>
<div class="app" id="app"></div>
<script>
const tk = (name, meta, o = {}) => `<div class="card tk ${o.sel ? 'sel' : ''}"><div class="thumb">${I('tank')}</div>
  <div><div class="t">${name}</div><div class="m">${meta}</div>${o.pills ? `<div style="display:flex;gap:4px;margin-top:4px">${o.pills}</div>` : ''}</div>
  <div style="display:flex;gap:4px;align-items:center">${o.right || ''}<button class="lockbtn" title="Use this one for sure">${I('lock')}</button></div></div>`;
document.getElementById('app').innerHTML = apphead() + rail('tank', {animals: '!'}) + `
<section class="panel">
  <div class="sec-head"><button class="btn icon ghost sm" title="Back to Tank">&#9664;</button><h2>Choose a tank</h2><span class="hint">arrow keys flip, the tank redraws</span></div>
  <div class="sec-body">
    <div class="input" style="display:flex;align-items:center;gap:6px;color:var(--text-3)">${I('search')} Search tanks</div>
    <div class="group"><div class="gh">Custom tanks <span class="n">2</span><span class="sum">Living-room bow 60, Shelf cube</span></div></div>
    <div class="group"><div class="gh">Commercial tanks <span class="n">118</span><span class="sum">fixed size and build &middot; in use: Aqueon 40 breeder</span></div></div>
    <button class="btn" style="justify-self:start">${I('plus')} New custom tank</button>
    <div class="hint">Open a group to browse; the tank you flip to redraws in the room.</div>
  </div>
</section>
<main class="viewer">
  <div class="ov" style="top:12px;left:50%;transform:translateX(-50%)">${toolbar()}</div>
  <div class="ov" style="bottom:14px;left:50%;transform:translateX(-50%)">${checkbar({full: 1})}</div>
</main>`;
</script>
<div style="position:absolute;inset:0;pointer-events:none">
  <div class="note" data-n="1" style="top:118px;left:492px;max-width:260px">&#9664; Both groups start closed (Nathan 11-13); the line shows what is inside</div>
  <div class="note" data-n="2" style="top:170px;left:492px;max-width:260px">&#9664; Commercial: fixed size and build. Open state: 06b-tank-picker-open.png</div>
  <div class="note" data-n="3" style="top:222px;left:492px;max-width:260px">&#9664; Opens the custom tank maker as its own workspace (shot 07)</div>
</div>
</body></html>
