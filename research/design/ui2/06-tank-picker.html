<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>UI2 mockup: Tank > Choose a tank (commercial / custom)</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .app { display: grid; height: 100vh; grid-template-columns: var(--rail-w) 420px 1fr; grid-template-rows: var(--header-h) 1fr; grid-template-areas: "head head view" "rail panel view"; }
  .app > header { grid-area: head; } .app > .rail { grid-area: rail; } .app > .panel { grid-area: panel; } .app > .viewer { grid-area: view; }
  .tk { display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: var(--s3); align-items: center; padding: var(--s2) var(--s3); }
  .tk .thumb { width: 44px; height: 36px; display: grid; place-items: center; color: #3a4150; }
  .lockbtn { height: var(--ctl-h-sm); padding: 0 var(--s2); border-radius: var(--r-pill); border: 1px solid var(--line); background: transparent; color: var(--text-3); display: inline-flex; align-items: center; }
  .lockbtn .i { width: 14px; height: 14px; }
  .gh .n { color: var(--text-3); font-weight: 400; }
</style></head>
<body>
<script src="icons.js"></script><script src="shell.js"></script>
<div class="app" id="app"></div>
<script>
const tk = (name, meta, o = {}) => `<div class="card tk ${o.sel ? 'sel' : ''}"><div class="thumb">${I('tank')}</div>
  <div><div class="t">${name}</div><div class="m">${meta}</div>${o.pills ? `<div style="display:flex;gap:4px;margin-top:4px">${o.pills}</div>` : ''}</div>
  <div style="display:flex;gap:4px;align-items:center">${o.right || ''}<button class="lockbtn" title="Use this one for sure">${I('lock')}</button></div></div>`;
document.getElementById('app').innerHTML = apphead() + rail('tank', {animals: '!'}) + `
<section class="panel">
  <div class="sec-head"><button class="btn icon ghost sm" title="Back to Tank">&#9664;</button><h2>Choose a tank</h2><span class="hint">arrow keys flip, the tank redraws</span></div>
  <div class="sec-body">
    <div class="input" style="display:flex;align-items:center;gap:6px;color:var(--text-3)">${I('search')} Search tanks</div>
    <div class="group open"><div class="gh">Custom tanks <span class="n">2</span><span class="sum">yours, kept across setups</span></div><div class="gb">
      ${tk('Living-room bow 60', 'Bow front &middot; 48 &times; 18 &times; 24 in &middot; 62 gal &middot; rimless', {pills: '<span class="pill ok">Owned</span>', right: '<button class="btn sm ghost">Edit</button>'})}
      ${tk('Shelf cube', 'Cube &middot; 12 &times; 12 &times; 12 in &middot; 7.5 gal &middot; rimless', {right: '<button class="btn sm ghost">Edit</button>'})}
      <button class="btn sm" style="justify-self:start">${I('plus')} New custom tank</button>
    </div></div>
    <div class="group open"><div class="gh">Commercial tanks <span class="n">118</span><span class="sum">fixed size and build</span></div><div class="gb">
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">Under 20 gal</span><span class="chip on">20-40</span><span class="chip">40-75</span><span class="chip">75+</span><span class="chip on">Fits my space</span></div>
      ${tk('Aqueon 29 gal', '30 &times; 12 &times; 18 in &middot; rimmed &middot; $99', {right: '<span class="hint">$450-1,400</span>'})}
      ${tk('Aqueon 40 gal breeder', '36 &times; 18 &times; 16 in &middot; rimmed &middot; $139', {sel: 1, pills: '<span class="pill accent">In use</span>', right: '<span class="hint">$600-1,900</span>'})}
      ${tk('Waterbox Clear 35.2', '31.5 &times; 15.7 &times; 15.7 in &middot; rimless &middot; $330', {right: '<span class="hint">$800-2,300</span>'})}
      ${tk('UNS 90U', '35.4 &times; 17.7 &times; 17.7 in &middot; rimless &middot; $380', {right: '<span class="hint">$850-2,400</span>'})}
    </div></div>
    <button class="btn primary" style="justify-self:stretch">Choose Aqueon 40 gal breeder</button>
  </div>
</section>
<main class="viewer">
  <div class="ov" style="top:12px;left:50%;transform:translateX(-50%)">${toolbar()}</div>
  <div class="ov" style="bottom:14px;left:50%;transform:translateX(-50%)">${checkbar({full: 1})}</div>
</main>`;
</script>
<div style="position:absolute;inset:0;pointer-events:none">
  <div class="note" data-n="1" style="top:110px;left:492px;max-width:250px">&#9664; Custom tanks: made in the custom tank maker, named, kept across setups</div>
  <div class="note" data-n="2" style="top:330px;left:492px;max-width:250px">&#9664; Commercial tanks: off the shelf; size and build cannot be edited. Grey range = finished-tank price (Nathan 11-05; mockup numbers)</div>
  <div class="note" data-n="3" style="top:200px;left:492px;max-width:250px">&#9664; Owned pill and "for sure" lock work as in Equipment</div>
</div>
</body></html>
