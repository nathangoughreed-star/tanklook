<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fish landmarks</title>
<style>
:root{--bg:#10151b;--panel:#1a222c;--ink:#e6edf3;--mut:#8b9bab;--acc:#ffd23f;--ok:#3ddc84}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,Segoe UI,sans-serif;display:flex;flex-direction:column;height:100vh}
#top{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--panel);flex-wrap:wrap}
#top label{color:var(--mut);font-size:12px}#top input[type=text],#top input[type=number]{background:#0c1117;color:var(--ink);border:1px solid #2c3a49;border-radius:4px;padding:3px 6px}
button{background:#2a3a4c;color:var(--ink);border:1px solid #3b4f66;border-radius:5px;padding:5px 10px;cursor:pointer}button:hover{background:#355070}
#main{flex:1;display:flex;min-height:0}
#cv{flex:1;min-width:0;cursor:crosshair;display:block}
#side{width:290px;background:var(--panel);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:10px}
#prompt{font-size:16px;font-weight:600;color:var(--acc)}#hint{color:var(--mut);font-size:13px}
#steps{font-size:12px;line-height:1.5;color:var(--mut)}#steps .done{color:var(--ok)}#steps .cur{color:var(--acc);font-weight:700}
#diag{background:#0c1117;border-radius:6px}
#msg{color:var(--mut);font-size:12px}kbd{background:#0c1117;border:1px solid #2c3a49;border-radius:3px;padding:0 4px}
</style></head><body>
<div id="top">
 <input type="file" id="file" accept="image/*" multiple>
 <label>id <input type="text" id="fid" size="12"></label>
 <label>name <input type="text" id="fname" size="12"></label>
 <label>scientific <input type="text" id="fsci" size="18"></label>
 <label>TL mm <input type="number" id="ftl" size="5" style="width:70px" value="100"></label>
 <label>sheet path in the JSON <input type="text" id="fpath" size="34"></label>
 <button id="undo">Undo (Z)</button><button id="skip">Skip step (S)</button><button id="fit">Fit (F)</button>
</div>
<div id="main">
 <canvas id="cv"></canvas>
 <div id="side">
  <div id="prompt">Pick a sheet image</div><div id="hint">Choose one or more sheets with the file picker (top left). Fish should face right.</div>
  <svg id="diag" viewBox="0 0 270 130" width="270" height="130"></svg>
  <div id="steps"></div>
  <div id="msg">Wheel = zoom, drag = pan, click = place a point, <kbd>Enter</kbd> = finish a multi-point step, <kbd>Z</kbd> = undo, <kbd>S</kbd> = skip.</div>
 </div>
</div>
<script>
// Steps: kind 'pt' (one click), 'poly' (several clicks, Enter), diag = target position in the diagram.
const STEPS=[
 {k:'ped',t:'Tail base',h:'Click the CENTRE of the tail stalk where it meets the tail fin (the base of the tail fin, where the body ends).',kind:'pt',d:[[62,62]]},
 {k:'dorsal',t:'Dorsal fin base',h:'Click along the line where the dorsal fin meets the back, FRONT to BACK, and keep going until the last click is on the top edge of the body right at the tail base, under the rear end of the fin (5-12 clicks). Enter when done.',kind:'poly',min:2,d:[[190,26],[150,22],[110,24],[80,40]]},
 {k:'anal',t:'Anal fin base',h:'Click along where the anal fin meets the belly, FRONT to BACK, and keep going until the last click is on the bottom edge of the body right at the tail base (3-8 clicks). Enter when done.',kind:'poly',min:2,d:[[130,92],[105,94],[80,84]]},
 {k:'eyec',t:'Eye centre',h:'Click the centre of the eye.',kind:'pt',d:[[218,56]]},
 {k:'eyer',t:'Eye edge',h:'Click the edge of the eye (any side) to set its size.',kind:'pt',d:[[226,56]]},
 {k:'pec0',t:'Pectoral: root',h:'Click where the pectoral (side) fin attaches to the body.',kind:'pt',d:[[188,74]]},
 {k:'pecO',t:'Pectoral: outline',h:'Trace the OUTER EDGE of the fin: click 4-6 points around it (any shape, round is fine), going from near the root at the top, round the back, to near the root at the bottom. Enter when done.',kind:'poly',min:3,d:[[170,64],[152,70],[148,80],[160,88],[176,82]]},
 {k:'pel0',t:'Pelvic: root',h:'Click where the pelvic (belly) fin attaches to the body.',kind:'pt',d:[[180,92]]},
 {k:'pelO',t:'Pelvic: outline',h:'Trace the OUTER EDGE of the fin: click 4-6 points around it, from near the root at the front, round the tip, back to near the root. Enter when done.',kind:'poly',min:3,d:[[172,100],[160,112],[148,116],[160,100]]}
];
const $=id=>document.getElementById(id);const cv=$('cv'),cx=cv.getContext('2d');
let queue=[],img=null,fileName='',view={s:1,x:0,y:0},pts={},step=0,cur=[],hist=[],bbox=null,t0=0,clickLog=[],mouse=null;
function drawDiag(){const s=STEPS[step];let h='<path d="M20 62 Q60 22 140 24 L205 40 Q245 58 232 70 Q215 96 150 98 L60 84 Z" fill="#2a3a4c" stroke="#556" /><path d="M20 62 L2 36 L8 62 L2 88 Z" fill="#2a3a4c" stroke="#556"/><path d="M80 40 Q120 4 190 26" fill="#3a4a5c" stroke="#556"/><path d="M80 84 Q100 112 130 92" fill="#3a4a5c" stroke="#556"/><path d="M188 74 L150 84 L162 62 Z" fill="#3a4a5c" stroke="#556"/><path d="M180 92 L150 114 L168 108 Z" fill="#3a4a5c" stroke="#556"/><circle cx="218" cy="56" r="6" fill="#0c1117" stroke="#889"/>';
 if(s)s.d.forEach(p=>h+=`<circle cx="${p[0]}" cy="${p[1]}" r="6" fill="none" stroke="#ffd23f" stroke-width="2.5"/><circle cx="${p[0]}" cy="${p[1]}" r="1.8" fill="#ffd23f"/>`);
 $('diag').innerHTML=h}
function steps(){let h='';STEPS.forEach((s,i)=>{const n=(pts[s.k]||[]).length||(i<step&&!pts[s.k]?'skipped':'');h+=`<div class="${i<step?'done':i==step?'cur':''}">${i<step?'✓':i==step?'▶':'·'} ${s.t} ${i<step?(n&&n!=1?'('+n+')':''):''}</div>`});$('steps').innerHTML=h}
function ui(){const s=STEPS[step];if(!img){return}if(!s){$('prompt').textContent='All done';$('hint').textContent='JSON saved to your Downloads folder'+(queue.length?'. Loading the next sheet…':'.');}else{$('prompt').textContent=(step+1)+'/'+STEPS.length+'  '+s.t;$('hint').textContent=s.h+(s.kind=='poly'?'  ['+cur.length+' placed]':'')}drawDiag();steps();draw()}
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width;cv.height=r.height;draw()}
function fit(){if(!img)return;const b=bbox,w=cv.width,h=cv.height,m=20;view.s=Math.max(.02,Math.min((w-2*m)/(b.x1-b.x0),(h-2*m)/(b.y1-b.y0)));view.x=m-b.x0*view.s+((w-2*m)-(b.x1-b.x0)*view.s)/2;view.y=m-b.y0*view.s+((h-2*m)-(b.y1-b.y0)*view.s)/2;draw()}
const toS=(px,py)=>[(px-view.x)/view.s,(py-view.y)/view.s],toC=(x,y)=>[x*view.s+view.x,y*view.s+view.y];
function draw(){cx.fillStyle='#000';cx.fillRect(0,0,cv.width,cv.height);if(!img)return;cx.imageSmoothingEnabled=view.s<3;cx.drawImage(img,view.x,view.y,img.width*view.s,img.height*view.s);
 const dot=(p,c)=>{const r=5;const[a,b]=toC(p[0],p[1]);cx.beginPath();cx.arc(a,b,r,0,7);cx.strokeStyle=c;cx.lineWidth=2;cx.stroke();cx.beginPath();cx.arc(a,b,1.5,0,7);cx.fillStyle=c;cx.fill()};
 const line=(a,c)=>{if(a.length<2)return;cx.beginPath();a.forEach((p,i)=>{const[x,y]=toC(p[0],p[1]);i?cx.lineTo(x,y):cx.moveTo(x,y)});cx.strokeStyle=c;cx.lineWidth=2;cx.stroke()};
 const col={ped:'#f0f',dorsal:'#ff0',anal:'#0f0',eyec:'#0ff',eyer:'#0ff',pec0:'#f44',pecO:'#f44',pel0:'#48f',pelO:'#48f'};
 for(const k in pts){pts[k].forEach(p=>dot(p,col[k]));if(pts[k].length>1)line(pts[k],col[k])}
 const s=STEPS[step];if(s&&s.kind=='poly'){cur.forEach(p=>dot(p,col[s.k]));line(cur,col[s.k])}
 if(pts.eyec&&pts.eyer){const[a,b]=toC(...pts.eyec[0]);const r=Math.hypot(pts.eyer[0][0]-pts.eyec[0][0],pts.eyer[0][1]-pts.eyec[0][1])*view.s;cx.beginPath();cx.arc(a,b,r,0,7);cx.strokeStyle='#0ff';cx.stroke()}
 if(mouse){cx.strokeStyle='rgba(255,255,255,.25)';cx.lineWidth=1;cx.beginPath();cx.moveTo(mouse[0],0);cx.lineTo(mouse[0],cv.height);cx.moveTo(0,mouse[1]);cx.lineTo(cv.width,mouse[1]);cx.stroke()}}
function bands(im){const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);const d=g.getImageData(0,0,c.width,c.height).data;let rows=[];
 for(let y=0;y<c.height;y++){let on=false;for(let x=0;x<c.width;x++){const i=(y*c.width+x)*4;if(Math.max(d[i],d[i+1],d[i+2])>40){on=true;break}}rows.push(on)}
 let y=rows.indexOf(true);if(y<0)return{x0:0,y0:0,x1:im.width,y1:im.height};let y0=y,p=y;
 for(let r=y+1;r<rows.length;r++){if(rows[r]){if(r-p>3&&p-y0>30)break;if(r-p>3)y0=r;p=r}}
 let x0=1e9,x1=0;for(let yy=y0;yy<=p;yy++)for(let x=0;x<c.width;x++){const i=(yy*c.width+x)*4;if(Math.max(d[i],d[i+1],d[i+2])>40){if(x<x0)x0=x;if(x>x1)x1=x}}
 return{x0:Math.max(0,x0-10),y0:Math.max(0,y0-10),x1:Math.min(im.width,x1+10),y1:Math.min(im.height,p+10)}}
function loadNext(){if(!queue.length)return;const f=queue.shift();fileName=f.name;const u=URL.createObjectURL(f);const im=new Image();im.onload=()=>{img=im;bbox=bands(im);pts={};cur=[];hist=[];step=0;clickLog=[];t0=0;
  const base=f.name.replace(/\.[^.]+$/,'');$('fid').value=$('fid').value&&queue.length===0&&false?$('fid').value:base.split('-')[0].replace(/[^a-z0-9]/gi,'');$('fname').value=base.split('-')[0];$('fpath').value='C:/Users/nreed/fish-sheets/shapes/'+f.name;resize();fit();ui()};im.src=u}
$('file').onchange=e=>{queue=[...e.target.files];loadNext()};
function setPt(k,p){pts[k]=[p]}
function advance(){step++;while(STEPS[step]&&false)step++;cur=[];if(step>=STEPS.length){finish()}ui()}
function finish(){const P=pts,g=k=>P[k]&&P[k][0];const r=a=>a.map(p=>[Math.round(p[0]),Math.round(p[1])]);const spec={id:$('fid').value||'fish',sheet:$('fpath').value,species:{name:$('fname').value,sci:$('fsci').value,tl:+$('ftl').value},
  landmarks:{ped:r([g('ped')])[0],dorsalBase:r(P.dorsal||[]),analBase:r(P.anal||[])}};
 if(g('eyec')){const e=g('eyec'),q=g('eyer')||[e[0]+14,e[1]];spec.eye=[Math.round(e[0]),Math.round(e[1]),Math.round(Math.hypot(q[0]-e[0],q[1]-e[1]))]}
 if(g('pec0')){const poly=r([g('pec0'),...(P.pecO||[])]);spec.pectoral={root:poly[0],poly,spread:1.0}}
 if(g('pel0')){const poly=r([g('pel0'),...(P.pelO||[])]);const len=Math.max(...poly.map(p=>Math.hypot(p[0]-poly[0][0],p[1]-poly[0][1])));const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]);
  spec.pelvic={root:poly[0],len:Math.round(len),poly};spec.erase=[[Math.min(...xs)-15,Math.min(...ys)-15,Math.max(...xs)+15,Math.max(...ys)+15]]}
 spec.measured_width=true;spec.plan='oscar';
 const secs=t0?Math.round((performance.now()-t0)/1000):0;spec._meta={tool:'fish-landmarks.html',seconds:secs,clicks:clickLog.length,undos:clickLog.filter(c=>c.u).length,stepSeconds:clickLog.filter(c=>!c.u).map(c=>[c.k,+(c.t/1000).toFixed(1)])};
 const blob=new Blob([JSON.stringify(spec,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(spec.id)+'-b.json';document.body.appendChild(a);a.click();a.remove();
 $('msg').textContent='Saved '+spec.id+'-b.json ('+secs+' s, '+clickLog.length+' clicks).';if(queue.length)setTimeout(loadNext,1200)}
function undo(){const s=STEPS[step];if(s&&s.kind=='poly'&&cur.length){cur.pop();clickLog.push({u:1,t:0});draw();ui();return}
 if(step>0){step--;const k=STEPS[step].k;delete pts[k];cur=[];clickLog.push({u:1,t:0});ui()}}
function skip(){const s=STEPS[step];if(!s)return;if(s.kind=='poly'&&cur.length>=s.min){pts[s.k]=cur}advance()}
function place(p){const s=STEPS[step];if(!s)return;if(!t0)t0=performance.now();const now=performance.now();clickLog.push({k:s.k,t:now-(clickLog.length?clickLog.t:t0)});clickLog.t=now;
 if(s.kind=='pt'){setPt(s.k,p);advance()}else{cur.push(p);ui()}}
let drag=null,moved=false;
cv.onmousedown=e=>{drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y};moved=false};
cv.onmousemove=e=>{mouse=[e.offsetX,e.offsetY];if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved){view.x=drag.vx+dx;view.y=drag.vy+dy}}draw()};
cv.onmouseup=e=>{if(drag&&!moved&&img)place(toS(e.offsetX,e.offsetY));drag=null};cv.onmouseleave=()=>{mouse=null;draw()};
cv.onwheel=e=>{e.preventDefault();const f=e.deltaY<0?1.2:1/1.2,[sx,sy]=toS(e.offsetX,e.offsetY);view.s*=f;view.x=e.offsetX-sx*view.s;view.y=e.offsetY-sy*view.s;draw()};
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;const k=e.key.toLowerCase();if(k=='z')undo();else if(k=='s')skip();else if(k=='f')fit();else if(k=='enter'){const s=STEPS[step];if(s&&s.kind=='poly'&&cur.length>=s.min){pts[s.k]=cur;advance()}}else if(k=='+'||k=='='){view.s*=1.2;draw()}else if(k=='-'){view.s/=1.2;draw()}});
$('undo').onclick=undo;$('skip').onclick=skip;$('fit').onclick=fit;addEventListener('resize',resize);resize();drawDiag();steps();
</script></body></html>
